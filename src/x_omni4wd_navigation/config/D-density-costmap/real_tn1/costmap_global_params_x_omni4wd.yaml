# Track D — Robot thật — real_tn1: Proxemic only (baseline, không social layers bổ sung, không density gate)
# density.button_state OFF trong social_config → current_density = 0.0 → cost không bị scale
global_costmap:
  global_frame: map
  robot_base_frame: base_footprint
  transform_tolerance: 0.7
  update_frequency: 2.0
  publish_frequency: 0.5
  resolution: 0.05
  footprint_padding: 0.005
  rolling_window: false
  plugins:
    - { name: static_layer,    type: "costmap_2d::StaticLayer" }
    - { name: obstacles_layer, type: "costmap_2d::ObstacleLayer" }
    - { name: inflation_layer, type: "costmap_2d::InflationLayer" }
    - { name: proxemic,        type: "social_navigation_layers::ProxemicLayer" }
    # real_tn2/tn3: uncomment passing, human_group_layer, human_object_layer, emotion_layer

  static_layer:
    enabled: true

  obstacles_layer:
    observation_sources: base_scan
    base_scan:
      data_type: LaserScan
      sensor_frame: lidar_link
      topic: /scan
      clearing: true
      marking: true
      inf_is_valid: true
      observation_persistence: 0.0
      expected_update_rate: 0.5
      obstacle_range: 10.0
      raytrace_range: 12.0
    track_unknown_space: false
    footprint_clearing_enabled: true
    combination_method: 1
    mark_threshold: 0
    clear_threshold: 1

  inflation_layer:
    enabled: true
    cost_scaling_factor: 100.0
    inflation_radius: 0.28

  proxemic:
    enabled: true
    cutoff: 22.0  # = lethal_cost = TEB threshold; nâng để thu hẹp r_proxemic
    amplitude: 77.0
    covariance: 0.25
    factor: 5.0
    min_radius: 0.6
    proxemic_density_weight: 22.0
    keep_time: 2.0
