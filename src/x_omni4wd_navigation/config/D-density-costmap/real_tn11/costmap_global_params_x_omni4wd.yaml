# Track D — Robot thật — real_tn11: KHÔNG social layer (kể cả Proxemic) — baseline nav thuần
# Độc lập hoàn toàn với real_tn8/9/10. Density OFF trong social_config.
global_costmap:
  global_frame: map
  robot_base_frame: base_footprint
  transform_tolerance: 0.7
  update_frequency: 2.0
  publish_frequency: 0.5
  resolution: 0.05
  footprint_padding: 0.015
  rolling_window: false
  plugins:
    - { name: static_layer,    type: "costmap_2d::StaticLayer" }
    - { name: obstacles_layer, type: "costmap_2d::ObstacleLayer" }
    - { name: inflation_layer, type: "costmap_2d::InflationLayer" }

  static_layer:
    enabled: true

  obstacles_layer:
    observation_sources: base_scan
    base_scan:
      data_type: LaserScan
      sensor_frame: lidar_link
      topic: /scan
      clearing: true
      marking: true
      inf_is_valid: true
      observation_persistence: 0.0
      expected_update_rate: 0.5
      obstacle_range: 10.0
      raytrace_range: 12.0
    track_unknown_space: false
    footprint_clearing_enabled: true
    combination_method: 1
    mark_threshold: 0
    clear_threshold: 1

  inflation_layer:
    enabled: true
    cost_scaling_factor: 30.0
    inflation_radius: 0.30
