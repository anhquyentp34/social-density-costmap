# Lite costmap — chỉ static + prediction tube (không Gazebo, không proxemic).
# Robot + người gần gốc → tube nằm trong local 10×10.

global_costmap:
  global_frame: map
  robot_base_frame: base_footprint
  transform_tolerance: 0.5
  update_frequency: 5.0
  publish_frequency: 2.0
  resolution: 0.05
  rolling_window: false
  robot_radius: 0.26
  plugins:
    - { name: static_layer, type: "costmap_2d::StaticLayer" }
    - { name: inflation_layer, type: "costmap_2d::InflationLayer" }
    - { name: prediction_aware_cost_tube_layer, type: "prediction_costmap_layers::PredictionAwareCostTubeLayer" }
  static_layer:
    enabled: true
  inflation_layer:
    enabled: true
    cost_scaling_factor: 53.78
    inflation_radius: 0.32
  prediction_aware_cost_tube_layer:
    enabled: true
    prediction_topic: /pedestrian/predicted_trajectories
    max_cost: 252.0
    temporal_decay: 0.3
    use_temporal_decay: true
    sigma_social_x: 0.35
    sigma_social_y: 0.35
    gaussian_cutoff_sigma: 3.0
    covariance_scale: 1.0
    epsilon_regularization: 0.000001
    min_cost_threshold: 0.5
    use_message_amplitude: true

local_costmap:
  global_frame: odom
  robot_base_frame: base_footprint
  transform_tolerance: 0.5
  update_frequency: 5.0
  publish_frequency: 2.0
  width: 10.0
  height: 10.0
  resolution: 0.05
  rolling_window: true
  robot_radius: 0.26
  plugins:
    - { name: inflation_layer, type: "costmap_2d::InflationLayer" }
    - { name: prediction_aware_cost_tube_layer, type: "prediction_costmap_layers::PredictionAwareCostTubeLayer" }
  inflation_layer:
    enabled: true
    cost_scaling_factor: 53.78
    inflation_radius: 0.32
  prediction_aware_cost_tube_layer:
    enabled: true
    prediction_topic: /pedestrian/predicted_trajectories
    max_cost: 252.0
    temporal_decay: 0.3
    use_temporal_decay: true
    sigma_social_x: 0.35
    sigma_social_y: 0.35
    gaussian_cutoff_sigma: 3.0
    covariance_scale: 1.0
    epsilon_regularization: 0.000001
    min_cost_threshold: 0.5
    use_message_amplitude: true
