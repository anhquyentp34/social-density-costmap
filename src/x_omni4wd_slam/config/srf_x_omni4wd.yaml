# Cấu hình SRF Laser Odometry cho x_omni4wd (thay RF2O khi chạy mode SRF)
# Khi dùng launch SRF: không chạy node rf2o_laser_odometry.
#
# Lưu ý: khi EKF publish_tf=true, SRF phải publish_tf=false (tránh TF conflict).
# odometry_modes.launch cũng override odom_topic → /odom_srf.

laser_scan_topic: "/scan"
odom_topic: "/odom_srf"
publish_tf: false
base_frame_id: "base_footprint"
odom_frame_id: "odom"
init_pose_from_topic: ""

# CS=consecutive, KS=keyscan, HYBRID=three-scan (paper default)
# HYBRID đo được drift < 1 mm khi đứng yên trên RPLidar A2 360°; CS ~1.6 cm.
operation_mode: "HYBRID"

# Bỏ điểm gần thân robot (RPLidar A2 trên x_omni4wd)
laser_decimation: 1
laser_min_range: 0.20
laser_max_range: -1.0

# Covariance: tin yaw SRF hơn để kéo lại bias gyro IMU khi đứng yên.
pose_cov_x: 0.0810
pose_cov_y: 0.0810
pose_cov_yaw: 0.06
twist_cov_vx: 0.10
twist_cov_vy: 0.10
twist_cov_wz: 0.08
