# P10 engineering full stack (no GTSAM): SRF directional + soft VIO + IMU wz
# Topics require reliability.launch + publish_vio_odom + publish_imu
# Output EKF → /odometry/filtered; relay publishes /odom_livo

frequency: 50.0
sensor_timeout: 0.35
two_d_mode: true
print_diagnostics: true
publish_tf: true
publish_acceleration: false

map_frame: map
odom_frame: odom
base_link_frame: base_footprint
world_frame: odom

use_control: false

# SRF directional (P8)
odom0: /odom_srf_directional
odom0_config: [true,  true,  false,
               false, false, true,
               true,  true,  false,
               false, false, false,
               false, false, false]
odom0_queue_size: 10
odom0_nodelay: true
odom0_differential: false
odom0_relative: false
odom0_pose_rejection_threshold: 8.0
odom0_twist_rejection_threshold: 2.5

# Soft-gated VIO (P9)
odom1: /odom_zed_soft
odom1_config: [true,  true,  false,
               false, false, true,
               false, false, false,
               false, false, false,
               false, false, false]
odom1_queue_size: 10
odom1_nodelay: true
odom1_differential: false
odom1_relative: false
odom1_pose_rejection_threshold: 5.0
odom1_twist_rejection_threshold: 2.0

# Raw IMU wz (như srf_zed_imu)
imu0: /zed_imu
imu0_config: [false, false, false,
              false, false, false,
              false, false, false,
              false, false, true,
              false, false, false]
imu0_nodelay: true
imu0_differential: false
imu0_relative: true
imu0_queue_size: 100
imu0_remove_gravitational_acceleration: true
imu0_pose_rejection_threshold: 5.0
imu0_twist_rejection_threshold: 3.0

