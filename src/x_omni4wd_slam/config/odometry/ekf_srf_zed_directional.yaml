# odom_mode: srf_zed_directional (P8 ablation)
# Giống srf_zed nhưng odom0 = /odom_srf_directional (R động theo hướng).
# Cần chạy reliability.launch (enable_directional_cov:=true) trước.
# Không fuse raw IMU (VIO đã dùng IMU SDK).

frequency: 50.0
sensor_timeout: 0.35
two_d_mode: true
print_diagnostics: true
publish_tf: true
publish_acceleration: false

map_frame: map
odom_frame: odom
base_link_frame: base_footprint
world_frame: odom

use_control: false

odom0: /odom_srf_directional
odom0_config: [true,  true,  false,
               false, false, true,
               true,  true,  false,
               false, false, false,
               false, false, false]
odom0_queue_size: 10
odom0_nodelay: true
odom0_differential: false
odom0_relative: false
odom0_pose_rejection_threshold: 8.0
odom0_twist_rejection_threshold: 2.5

odom1: /odom_zed
odom1_config: [true,  true,  false,
               false, false, true,
               false, false, false,
               false, false, false,
               false, false, false]
odom1_queue_size: 10
odom1_nodelay: true
odom1_differential: false
odom1_relative: false
odom1_pose_rejection_threshold: 4.0
odom1_twist_rejection_threshold: 2.0

