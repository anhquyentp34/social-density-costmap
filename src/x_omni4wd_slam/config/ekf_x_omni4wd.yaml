# EKF fusion x_omni4wd: wheel odom + RF2O laser odom (robot_localization)
# Load bởi ekf_localization_node trong x_omni4wd_slam/launch/ekf_odom_fusion.launch
#
# odom0 (/odom_wheel): twist vx, vy, vyaw — tần số cao
# odom1 (/odom_rf2o):  pose x, y, yaw — ít trôi dài hạn
#
# Đầu ra: /odometry/filtered (+ relay -> /odom) và TF odom -> base_footprint

frequency: 50.0
sensor_timeout: 0.35
two_d_mode: true
print_diagnostics: true
publish_tf: true
publish_acceleration: false

map_frame: map
odom_frame: odom
base_link_frame: base_footprint
world_frame: odom

odom0: odom_wheel
odom0_config: [false, false, false,
               false, false, false,
               true,  true,  false,
               false, false, false,
               false, false, false]
odom0_queue_size: 5
odom0_nodelay: true
odom0_differential: false
odom0_relative: false
odom0_pose_rejection_threshold: 5.0
odom0_twist_rejection_threshold: 0.8

odom1: odom_rf2o
odom1_config: [true,  true,  false,
               false, false, true,
               false, false, false,
               false, false, false,
               false, false, false]
odom1_queue_size: 10
odom1_nodelay: true
odom1_differential: false
odom1_relative: false
odom1_pose_rejection_threshold: 6.0
odom1_twist_rejection_threshold: 2.0

use_control: false
stamped_control: false
control_timeout: 0.3
control_config: [true, true, false, false, false, true]
acceleration_limits: [0.4, 0.4, 0.0, 0.0, 0.0, 0.85]
deceleration_limits: [0.4, 0.4, 0.0, 0.0, 0.0, 0.85]
